version: '2'

linters:
  default: standard # errcheck, govet, inefassing, staticcheck, unused
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - dogsled
    # - dupl
    - durationcheck
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocognit
    - goconst
    - gocritic
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - iface
    - inamedparam
    - interfacebloat
    - iotamixing
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - tagalign
    - tagliatelle
    - testableexamples
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - wrapcheck
    # - wsl_v5
  disable: []
  settings:
    errcheck:
      exclude-functions:
        - (io.StringWriter).WriteString
        - (fmt.State).Write
        - (net.Conn).SetDeadline
        - (net.Conn).SetReadDeadline
        - (net.Conn).SetWriteDeadline
        - (net.PacketConn).SetDeadline
        - (net.PacketConn).SetReadDeadline
        - (net.PacketConn).SetWriteDeadline
        - (*github.com/ghettovoice/gosip/internal/ioutil.CountingWriter).Write
        - (*github.com/ghettovoice/gosip/internal/ioutil.CountingWriter).WriteString
        - (github.com/ghettovoice/gosip/internal/shared.Renderer).RenderTo
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 25
    goconst:
      find-duplicates: true
      eval-const-expressions: true
      ignore-tests: true
      ignore-map-keys: true
      ignore-string-values:
        - (sips?|tel|upd|tcp|tls|wss?)
        - (ext|isub|phone-context)
      exclude-types:
        - Call
        - Case
        - Return
    godoclint:
      disable:
        - single-pkg-doc
    gosec:
      excludes:
        - G115
    govet:
      disable:
        - fieldalignment
      enable-all: true
    mnd:
      ignored-numbers:
        - '2'
        - '64'
        - '100' # /100 для классов статусов + priority
        - '200'
        - '300' # transport priorities
        - '400'
        - '500'
        - '600' # priorities + TimeC = 600*T1
        - '1024' # buffer capacities
        - '1500'
        - '80'
        - '443'
        - '5060'
        - '5061'
        - '0x7f' # varint mask
        - '0x80' # varint continuation bit
      ignored-functions:
        - make
        - ^(min|max)$
        - ^math\.
        - ^context\.WithTimeout
        - ^time\.
        - RandString
        - Grow
        - EnableNodeCache
        - ^util\.Ellipsis
    nolintlint:
      require-specific: true
      require-explanation: true
    paralleltest:
      check-cleanup: true
    recvcheck:
      exclusions:
        - '*.UnmarshalJSON'
        - '*.UnmarshalText'
    revive:
      rules:
        - name: argument-limit
        - name: blank-imports
        - name: call-to-gc
        - name: comment-spacings
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
          arguments:
            - allowTypesBefore: '*testing.T'
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: early-return
          arguments:
            - preserveScope
        - name: empty-lines
        - name: epoch-naming
        - name: enforce-map-style
          arguments: [any]
        - name: enforce-slice-style
          arguments: [any]
        - name: enforce-switch-style
          arguments: [allow-no-default]
        - name: forbidden-call-in-wg-go
        - name: function-result-limit
          arguments: [3]
        - name: get-return
        - name: if-return
        - name: import-alias-naming
        - name: increment-decrement
        - name: indent-error-flow
          arguments: [preserveScope]
        - name: inefficient-map-lookup
        - name: max-control-nesting
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: nested-structs
        - name: optimize-operands-order
        - name: package-directory-mismatch
        - name: range
        - name: redundant-import-alias
        - name: superfluous-else
          arguments: [preserveScope]
        - name: time-date
        - name: time-equal
        - name: time-naming
        - name: unexported-return
        - name: unsecure-url-scheme
        - name: use-fmt-print
        - name: use-slices-concat
        - name: use-slices-sort
        - name: useless-fallthrough
        - name: var-declaration
    sloglint:
      attr-only: true
      context: 'scope'
      static-msg: true
      msg-style: lowercased
      key-naming-case: snake
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
    unparam:
      check-exported: false
    unused:
      local-variables-are-used: false
    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true
    varnamelen:
      min-name-length: 1
      check-receiver: true
      check-return: true
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - err
      ignore-decls:
        - t testing.T
        - i int
        - T any
    wrapcheck:
      ignore-package-globs:
        - github.com/ghettovoice/gosip/internal/errors
        - github.com/ghettovoice/gosip/pkg/errclass
        - braces.dev/errtrace
  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - govet
        text: 'shadow: declaration of "(err|ctx|ok)" shadows declaration at'
      - linters:
          - containedctx
          - contextcheck
          - dupl
          - err113
          - forcetypeassert
          - gocognit
          - godoclint
          - maintidx
          - mnd
          - nilnil
          - noctx
          - varnamelen
          - wrapcheck
        path: (.+)_(test|deep)\.go
    paths: &exclude_paths []

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
  exclusions:
    generated: lax
    paths: *exclude_paths
